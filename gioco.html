<style>
  :root {
    --granata:#922F29; --granata-2:#B5382F; --notte:#3B0F0E; --pannello:#5A1A16; --pannello-2:#6B211B;
    --ink:#1E0B0A; --gesso:#FFF6EE; --gesso-2:#F3E3D6; --oro:#FFC531; --oro-2:#E89B00; --erba:#43D17A; --cielo:#57C7FF;
    --impegno:#FF8A3D; --coraggio:#FF4F5E; --rispetto:#2FC29B; --squadra:#9B87FF;
    --motore:#57C7FF; --recupero:#3D8BFF; --tocco:#FFD23A; --visione:#B7F34A;
    --dim:#E2BDB4; --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    --testo:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    min-height:100vh; color:var(--gesso); font-family:var(--testo); font-weight:700; font-size:16px; line-height:1.4;
    background-color:var(--notte);
    background-image:repeating-linear-gradient(90deg, rgba(146,47,41,.34) 0 30px, rgba(146,47,41,0) 30px 60px);
    background-attachment:fixed;
  }
  button,input,select,textarea { font-family:inherit; font-weight:800; font-size:16px; color:inherit; }
  :focus-visible { outline:3px solid var(--oro); outline-offset:2px; }
  .app { max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  .app.senza-tab { padding-bottom:calc(env(safe-area-inset-bottom) + 32px); }

  /* tipografia */
  .d { font-family:var(--display); font-weight:400; letter-spacing:.01em; color:#fff;
       text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink); }
  .d-s { font-family:var(--display); font-weight:400; letter-spacing:.01em; }
  h1.d { font-size:34px; line-height:1.05; margin:6px 0 4px; }
  h2.d { font-size:24px; line-height:1.1; margin:0 0 10px; }
  h3 { font-family:var(--display); font-weight:400; font-size:19px; margin:0 0 6px; color:#fff; }
  p { margin:0 0 10px; }
  .fioco { color:var(--dim); font-weight:700; }
  .piccolo { font-size:13.5px; }
  .num { font-variant-numeric:tabular-nums; }

  /* testata */
  .testata { display:flex; align-items:center; gap:10px; padding:6px 0 14px; }
  .testata img { width:38px; height:41px; filter:drop-shadow(0 3px 0 var(--ink)); }
  .testata .marchio { font-family:var(--display); font-size:21px; line-height:1; color:#fff; text-shadow:0 3px 0 var(--ink); }
  .testata .marchio small { display:block; font-family:var(--testo); font-size:12px; font-weight:800; color:var(--dim); text-shadow:none; margin-top:2px; }
  .testata .dx { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .pill-trofei { display:flex; align-items:center; gap:6px; background:var(--ink); border:3px solid var(--ink); border-radius:999px;
                 padding:3px 12px 3px 4px; box-shadow:inset 0 0 0 2px #3a1512; }
  .pill-trofei b { font-family:var(--display); font-weight:400; font-size:20px; color:var(--oro); }
  .cambio { background:none; border:2px solid rgba(255,246,238,.35); color:var(--gesso); border-radius:999px; padding:5px 10px; font-size:13px; cursor:pointer; }

  /* pannelli */
  .pan { background:var(--pannello); border:3px solid var(--ink); border-radius:20px; padding:16px; margin:0 0 16px;
         box-shadow:0 5px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.07); }
  .pan.chiaro { background:var(--gesso); color:var(--ink); }
  .pan.chiaro .fioco { color:#7a5a52; }
  .pan.chiaro h3 { color:var(--ink); }
  .riga { display:flex; align-items:center; gap:10px; }
  .riga.sp { justify-content:space-between; }
  .wrap { flex-wrap:wrap; }
  .gr2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .gr3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .gr4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .sep { height:3px; background:rgba(0,0,0,.25); border-radius:3px; margin:14px 0; }

  /* bottoni */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; user-select:none;
         font-family:var(--display); font-weight:400; font-size:20px; line-height:1; letter-spacing:.01em;
         background:var(--oro); color:var(--ink); border:3px solid var(--ink); border-radius:16px; padding:13px 18px;
         box-shadow:0 5px 0 var(--ink), inset 0 -4px 0 var(--oro-2), inset 0 3px 0 rgba(255,255,255,.45); transition:transform .06s; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 var(--ink), inset 0 -4px 0 var(--oro-2); }
  .btn.pieno { width:100%; }
  .btn.bianco { background:var(--gesso); box-shadow:0 5px 0 var(--ink), inset 0 -4px 0 #d9c3b3, inset 0 3px 0 #fff; }
  .btn.verde { background:var(--erba); box-shadow:0 5px 0 var(--ink), inset 0 -4px 0 #26a85a, inset 0 3px 0 rgba(255,255,255,.4); }
  .btn.rosso { background:#FF6B5E; box-shadow:0 5px 0 var(--ink), inset 0 -4px 0 #d9473b; }
  .btn.piccolo { font-size:16px; padding:9px 12px; border-radius:12px; box-shadow:0 4px 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,.15); }
  .btn[disabled] { opacity:.45; pointer-events:none; }
  .link { background:none; border:none; color:var(--oro); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px 0; font-weight:800; }
  .pan.chiaro .link { color:var(--granata); }

  /* campi */
  .campo { display:block; margin:0 0 12px; }
  .campo span { display:block; font-size:14px; margin:0 0 5px; color:var(--dim); }
  .pan.chiaro .campo span { color:#7a5a52; }
  .inp { width:100%; padding:12px 14px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); font-size:18px; }
  .inp.pin { letter-spacing:.5em; text-align:center; font-family:var(--display); font-weight:400; font-size:28px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:9px 13px; border:3px solid var(--ink); border-radius:999px;
          background:var(--gesso); color:var(--ink); cursor:pointer; font-weight:800; font-size:15px; box-shadow:0 3px 0 var(--ink); }
  .chip.on { background:var(--oro); }
  .chip:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }

  /* eroe: il Fighter */
  .eroe { position:relative; border:4px solid var(--ink); border-radius:26px; overflow:hidden; margin:0 0 18px;
          box-shadow:0 6px 0 var(--ink); }
  .eroe .numero { position:absolute; inset:-10px 0 auto 0; text-align:center; font-family:var(--display); font-size:230px; line-height:1;
          color:rgba(255,255,255,.13); -webkit-text-stroke:3px rgba(30,11,10,.35); pointer-events:none; }
  .eroe .figura { position:relative; display:flex; justify-content:center; padding:14px 0 0; }
  .eroe .figura svg { width:230px; height:auto; display:block; }
  .eroe .targa { position:relative; margin:-6px 12px 12px; background:rgba(30,11,10,.82); border:3px solid var(--ink); border-radius:16px;
          padding:10px 14px; display:flex; align-items:center; gap:10px; }
  .eroe .targa .nome { font-family:var(--display); font-size:28px; line-height:1; color:#fff; }
  .eroe .targa .titolo { font-size:14px; color:var(--oro); font-weight:800; margin-top:3px; }
  .grado { margin-left:auto; font-family:var(--display); font-size:15px; padding:5px 10px; border-radius:10px; border:3px solid var(--ink); color:var(--ink); }
  .g-rookie { background:#D9C7BC; } .g-fighter { background:#E79A5C; } .g-warrior { background:#C9D3DC; } .g-champion { background:var(--oro); } .g-legend { background:linear-gradient(135deg,#FFE27A,#FF8A3D,#FF4F5E,#9B87FF); }

  /* sfondi della card */
  .sf-spogliatoio { background:repeating-linear-gradient(90deg,#8a2b25 0 26px,#7a241f 26px 52px); }
  .sf-stadio { background:radial-gradient(circle at 15% 0%,rgba(255,255,220,.55),rgba(255,255,220,0) 35%),radial-gradient(circle at 85% 0%,rgba(255,255,220,.55),rgba(255,255,220,0) 35%),linear-gradient(#1b2b5c,#14301d 78%,#1d6b39 78%); }
  .sf-tramonto { background:linear-gradient(#ff8a3d,#ff4f5e 55%,#7b2b6b); }
  .sf-curva { background:radial-gradient(circle,rgba(255,255,255,.22) 2px,transparent 2.5px) 0 0/14px 14px, linear-gradient(#922F29,#5e1a16); }
  .sf-leggenda { background:repeating-conic-gradient(from 0deg at 50% 45%,#ffd85a 0 10deg,#ffb92e 10deg 20deg); }
  /* cornici */
  .cr-base { border-color:var(--ink); }
  .cr-bronzo { box-shadow:0 6px 0 var(--ink), inset 0 0 0 5px #CD7F32; }
  .cr-argento { box-shadow:0 6px 0 var(--ink), inset 0 0 0 5px #D5DEE6; }
  .cr-oro { box-shadow:0 6px 0 var(--ink), inset 0 0 0 5px var(--oro), inset 0 0 0 8px var(--ink); }
  .cr-leggenda { box-shadow:0 6px 0 var(--ink), inset 0 0 0 6px #ff4f5e, inset 0 0 0 9px var(--oro), inset 0 0 0 12px var(--ink); }
  .scintille::after { content:""; position:absolute; inset:0; pointer-events:none;
     background:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 80% 22%,#fff 0 2.5px,transparent 3.5px),radial-gradient(circle at 70% 60%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 28% 70%,#fff 0 2px,transparent 3px); }

  /* statistiche */
  .stat { display:grid; grid-template-columns:96px 1fr 44px; align-items:center; gap:8px; margin:0 0 8px; font-size:14.5px; }
  .barra { height:14px; background:rgba(0,0,0,.35); border:2px solid var(--ink); border-radius:8px; overflow:hidden; }
  .barra i { display:block; height:100%; border-radius:6px 0 0 6px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); }
  .lv { font-family:var(--display); font-size:15px; text-align:right; }

  /* missione */
  .missione { position:relative; overflow:hidden; }
  .missione .etichetta { display:inline-block; font-family:var(--display); font-size:13px; padding:3px 9px; border-radius:8px; background:var(--ink); color:#fff; margin:0 0 8px; }
  .missione .grande { font-family:var(--display); font-size:30px; line-height:1; margin:0 0 6px; color:#fff; text-shadow:0 3px 0 var(--ink); }

  /* elenchi */
  .voce { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:2px solid rgba(0,0,0,.22); }
  .voce:first-of-type { border-top:none; }
  .pallino { flex:none; width:30px; height:30px; border-radius:50%; border:3px solid var(--ink); display:grid; place-items:center; font-family:var(--display); font-size:15px; color:var(--ink); }
  .stella-ico { flex:none; width:34px; height:34px; }

  /* tessere (sfide, mosse) */
  .tessera { position:relative; text-align:left; background:var(--pannello-2); border:3px solid var(--ink); border-radius:16px; padding:12px; cursor:pointer;
             box-shadow:0 4px 0 var(--ink); color:var(--gesso); min-height:92px; display:flex; flex-direction:column; gap:4px; }
  .tessera:active { transform:translateY(2px); box-shadow:0 2px 0 var(--ink); }
  .tessera .t { font-family:var(--display); font-size:17px; line-height:1.05; color:#fff; }
  .tessera .r { font-size:13px; color:var(--dim); margin-top:auto; }
  .tessera.fatta { background:#2c6a45; }
  .tessera.chiusa { opacity:.62; }
  .tessera .badge { position:absolute; top:-9px; right:-6px; background:var(--oro); color:var(--ink); border:3px solid var(--ink); border-radius:10px; font-family:var(--display); font-size:13px; padding:1px 7px; }

  /* mini avatar */
  .mini { width:52px; height:52px; border-radius:16px; border:3px solid var(--ink); background:#7a241f; overflow:hidden; flex:none; }
  .mini svg { width:100%; height:100%; display:block; }
  .mini.g { width:64px; height:64px; }
  .spogliatoio { display:grid; grid-template-columns:repeat(4,1fr); gap:10px 8px; }
  .spogliatoio .c { text-align:center; font-size:12.5px; line-height:1.15; }
  .spogliatoio .c .mini { width:100%; height:auto; aspect-ratio:1; margin:0 0 4px; }

  /* boss */
  .boss { text-align:center; }
  .boss svg { width:210px; height:auto; }
  .energia { position:relative; height:26px; background:#2a0b0a; border:3px solid var(--ink); border-radius:14px; overflow:hidden; margin:6px 0 8px; }
  .energia i { position:absolute; inset:0 auto 0 0; background:linear-gradient(#ff7a6e,#e0362a); box-shadow:inset 0 -5px 0 rgba(0,0,0,.2); }
  .energia span { position:relative; font-family:var(--display); font-size:15px; line-height:20px; color:#fff; text-shadow:0 2px 0 var(--ink); }

  /* strada dei trofei */
  .strada { position:relative; padding-left:26px; }
  .strada::before { content:""; position:absolute; left:10px; top:8px; bottom:8px; width:8px; border-radius:6px; background:#2a0b0a; border:2px solid var(--ink); }
  .tappa { position:relative; margin:0 0 12px; padding:10px 12px; border:3px solid var(--ink); border-radius:14px; background:var(--pannello-2); }
  .tappa::before { content:""; position:absolute; left:-24px; top:14px; width:16px; height:16px; border-radius:50%; background:#2a0b0a; border:3px solid var(--ink); }
  .tappa.presa { background:#2c6a45; }
  .tappa.presa::before { background:var(--oro); }
  .tappa.qui { outline:3px solid var(--oro); outline-offset:3px; }
  .tappa .q { font-family:var(--display); font-size:17px; color:var(--oro); }
  .tappa .grado { margin-left:8px; font-size:13px; padding:2px 7px; }

  /* barra in basso */
  .tab { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--ink); padding:8px 8px calc(env(safe-area-inset-bottom) + 8px); }
  .tab .in { max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .tab button { background:#3a1512; border:none; border-radius:14px; padding:7px 4px 6px; color:var(--dim); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12.5px; font-weight:800; }
  .tab button svg { width:26px; height:26px; }
  .tab button.on { background:var(--oro); color:var(--ink); box-shadow:inset 0 -4px 0 var(--oro-2); }

  /* foglio (finestra dal basso) */
  .velo { position:fixed; inset:0; z-index:40; background:rgba(20,6,5,.66); display:flex; align-items:flex-end; justify-content:center; }
  .foglio { width:100%; max-width:540px; max-height:92vh; overflow:auto; background:var(--gesso); color:var(--ink); border:4px solid var(--ink); border-bottom:none;
            border-radius:26px 26px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 22px); animation:su .18s ease-out; }
  .foglio h2 { font-family:var(--display); font-weight:400; font-size:26px; margin:0 0 8px; }
  .foglio .fioco { color:#7a5a52; }
  .foglio .chiudi { float:right; width:40px; height:40px; border-radius:50%; border:3px solid var(--ink); background:#fff; font-size:20px; cursor:pointer; line-height:1; }
  .foglio .tessera { background:#fff; color:var(--ink); }
  .foglio .tessera .t { color:var(--ink); }
  .foglio .tessera .r { color:#7a5a52; }
  .foglio .link { color:var(--granata); }
  .foglio .campo span { color:#7a5a52; }
  @keyframes su { from { transform:translateY(40px); opacity:.4; } to { transform:none; opacity:1; } }

  /* timer */
  .timer { font-family:var(--display); font-size:64px; line-height:1; text-align:center; margin:8px 0 12px; color:var(--ink); }

  /* avvisi */
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%); z-index:60; width:min(92vw,480px);
           background:var(--ink); color:#fff; border-radius:16px; padding:12px 14px; display:flex; gap:12px; align-items:center; box-shadow:0 6px 0 rgba(0,0,0,.35); }
  .toast .link { margin-left:auto; color:var(--oro); }
  .errore { background:#ffe1dc; color:#7a1a12; border:3px solid #7a1a12; border-radius:14px; padding:10px 12px; margin:0 0 12px; font-size:15px; }

  /* sblocco */
  .festa { position:fixed; inset:0; z-index:70; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; background:rgba(20,6,5,.8); padding:24px 16px calc(env(safe-area-inset-bottom) + 24px); }
  .festa .scatola { margin:auto 0; }
  .festa .scatola { position:relative; width:100%; max-width:420px; text-align:center; background:var(--pannello); border:4px solid var(--ink); border-radius:26px; padding:22px 18px; box-shadow:0 6px 0 var(--ink); }
  .festa .scatola svg.f { width:170px; height:auto; }
  .coriandoli i { position:absolute; left:50%; top:30%; width:10px; height:14px; border:2px solid var(--ink); border-radius:3px; opacity:0; animation:esplodi 1.1s ease-out forwards; }
  @keyframes esplodi { 0% { opacity:1; transform:translate(-50%,-50%) rotate(0); } 100% { opacity:0; transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)); } }
  @media (prefers-reduced-motion: reduce) { .coriandoli { display:none; } .foglio { animation:none; } .btn { transition:none; } }

  /* staff */
  .riga-r { display:flex; align-items:center; gap:10px; padding:10px; margin:0 0 10px; background:var(--pannello-2); border:3px solid var(--ink); border-radius:16px; cursor:pointer; box-shadow:0 4px 0 var(--ink); width:100%; text-align:left; color:var(--gesso); }
  .riga-r .nm { font-family:var(--display); font-size:18px; line-height:1.05; color:#fff; }
  .riga-r .sb { font-size:13px; color:var(--dim); }
  .riga-r.vuota { background:#7a2a1f; }
  .comb { cursor:default; flex-wrap:wrap; }
  .comb .ctrl { display:flex; gap:8px; width:100%; align-items:center; }
  .comb .ctrl .inp { flex:1; min-width:0; padding:9px 12px; font-size:17px; }
  .puntini { margin-left:auto; display:flex; gap:5px; }
  .puntini i { width:16px; height:16px; border-radius:50%; border:2.5px solid var(--ink); background:rgba(0,0,0,.3); }
  .area-chip { display:inline-block; font-family:var(--display); font-size:13px; padding:2px 8px; border-radius:8px; border:2px solid var(--ink); color:var(--ink); }
  .frase { display:block; width:100%; text-align:left; padding:11px 12px; margin:0 0 8px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); cursor:pointer; box-shadow:0 3px 0 var(--ink); font-weight:800; }
  .frase:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .data-presa { padding:10px 12px; border:3px dashed #2c6a45; border-radius:14px; margin:0 0 8px; background:#e5f4e4; }
  canvas.riepilogo { width:100%; height:auto; border:3px solid var(--ink); border-radius:16px; display:block; margin:0 0 12px; }
  .seg { display:flex; gap:6px; background:var(--ink); padding:4px; border-radius:14px; margin:0 0 14px; }
  .seg button { flex:1; border:none; border-radius:10px; padding:9px 4px; background:transparent; color:var(--dim); cursor:pointer; font-size:14px; }
  .seg button.on { background:var(--oro); color:var(--ink); }
  .vuoto { text-align:center; padding:12px 6px; color:var(--dim); }
</style>

function lunedi(sett) {
  const y = +sett.slice(0, 4), w = +sett.slice(6);
  const g4 = new Date(Date.UTC(y, 0, 4)), dow = (g4.getUTCDay() + 6) % 7;
  return new Date(Date.UTC(y, 0, 4 - dow + (w - 1) * 7));
}
function isoSett(d) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
  const y = t.getUTCFullYear(), g4 = new Date(Date.UTC(y, 0, 4));
  const w = 1 + Math.round(((t - g4) / 864e5 - 3 + ((g4.getUTCDay() + 6) % 7)) / 7);
  return y + "-W" + String(w).padStart(2, "0");
}

  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method:"POST",
      headers:{ apikey:CONFIG.SUPABASE_ANON_KEY, Authorization:"Bearer " + CONFIG.SUPABASE_ANON_KEY, "Content-Type":"application/json" },
      body:JSON.stringify(args)
    });
  } catch (e) { throw new Error("rete"); }

  if (!r.ok) throw new Error("server");
  return r.json();
}

/* =====================================================================
   CALCOLI: trofei, statistiche, record
   (gli stessi valori di gioco_danni() nel database)
   ===================================================================== */
function calcola(eventi, ggRicevuti, bonusTrio, bossVinti) {
  const st = { impegno:0, coraggio:0, rispetto:0, squadra:0, motore:0, recupero:0, tocco:0, visione:0 };
  const record = {}, recordCombine = {}, perSett = {}, mosse = {};
  let trofei = 0, greencard = 0;
  const ev = [...eventi].sort((a, b) => (a.creato < b.creato ? -1 : a.creato > b.creato ? 1 : a.id - b.id));
  for (const e of ev) {
    const d = e.dati || {};
    if (e.tipo === "stella") {
      trofei += T.stella + (d.area === areaMissione(e.settimana).k ? T.missione : 0);
      if (st[d.area] != null) st[d.area] += 3;
      const f = (FRASI[d.area] || [])[d.frase]; if (f && f.t) st[f.t] += 2;
    } else if (e.tipo === "mossa") {
      trofei += T.mossa; st.tocco += 3; st.coraggio += 1; mosse[d.mossa] = e.creato;
    } else if (e.tipo === "sfida") {
      const sf = SFIDA[d.sfida]; if (!sf) continue;
      const n = (perSett[e.settimana] = (perSett[e.settimana] || 0) + 1);
      if (n <= T.sfidaMax) { trofei += T.sfida; st.impegno += 1; }
      st[sf.stat] += 1;
      const v = Number(d.valore), prev = record[d.sfida];
      const meglio = prev == null || (sf.verso > 0 ? v > prev : v < prev);
      if (prev != null && meglio) { trofei += T.record; st[sf.stat] += 1; }
      if (meglio) record[d.sfida] = v;
    } else if (e.tipo === "autovalutazione") {
      trofei += T.autoval; st.impegno += 1;
    } else if (e.tipo === "gg") {
      trofei += T.ggDato; st.squadra += 1;
    } else if (e.tipo === "combine") {
      const p = PROVA[d.prova]; if (!p) continue;
      trofei += T.combine; st[p.stat] += 1;
      const v = Number(d.valore), prev = recordCombine[d.prova];
      const meglio = prev == null || (p.verso > 0 ? v > prev : v < prev);
      if (prev != null && meglio) { trofei += T.recordCombine; st[p.stat] += 2; }
      if (meglio) recordCombine[d.prova] = v;
    } else if (e.tipo === "greencard") {
      trofei += T.greencard; st.rispetto += 5; greencard++;
    }
  }
  trofei += (ggRicevuti || []).length * T.ggRicevuto; st.squadra += (ggRicevuti || []).length;
  trofei += (bonusTrio || []).length * T.trio; st.squadra += 2 * (bonusTrio || []).length;
  trofei += (bossVinti || []).length * T.boss;
  const lv = Object.fromEntries(Object.entries(st).map(([k, p]) => [k, { p, lv:1 + Math.floor(p / 4), q:(p % 4) / 4 }]));
  return { trofei, st:lv, record, recordCombine, mosse, greencard, grado:grado(trofei) };
}
function sbloccato(tipo, k, trofei) {
  for (const tp of STRADA) for (const [t, kk] of tp.premi) if (t === tipo && kk === k) return trofei >= tp.t;
  return tipo === "capelli" || tipo === "colore" || tipo === "pelle" || tipo === "occhi" || (tipo === "acc" && k === "nessuno") || (tipo === "effetto" && k === "");
}
function sogliaDi(tipo, k) { for (const tp of STRADA) for (const [t, kk] of tp.premi) if (t === tipo && kk === k) return tp.t; return 0; }
function titoliDisponibili(c) {
  const out = GRADI.filter(g => c.trofei >= g.da).map(g => g.nome);

}

function editorAvatar(av, trofei, numero, conTitoli) {
  const a = { ...AV_BASE, ...av };
  const lucch = (tipo, k) => sbloccato(tipo, k, trofei) ? "" : ` 🔒${sogliaDi(tipo, k)}`;
  const gruppo = (titolo, tipo, voci) => `<div style="margin:0 0 14px"><h3>${titolo}</h3><div class="chips">${voci.map(([k, nome, extra]) => {
      const ok = sbloccato(tipo, k, trofei);
      return `<button class="chip${String(a[tipo]) === String(k) ? " on" : ""}" ${ok ? `data-act="av" data-t="${tipo}" data-k="${esc(k)}"` : `disabled style="opacity:.55"`}>${extra || ""}${esc(nome)}${lucch(tipo, k)}</button>`;
    }).join("")}</div></div>`;
  const tondo = c => `<i style="width:18px;height:18px;border-radius:50%;background:${c};border:2px solid #1E0B0A;display:inline-block"></i>`;
  let h = `<div class="eroe sf-${a.sfondo} cr-${a.cornice}${a.effetto === "scintille" ? " scintille" : ""}" style="margin-bottom:14px"><div class="numero">${esc(numero || "")}</div><div class="figura" id="anteprima">${fighterSVG(a, { numero })}</div></div>`;
  h += `<section class="pan chiaro">`;
  h += gruppo("Pelle", "pelle", PELLI.map((c, i) => [i, "", tondo(c)]));
  h += gruppo("Capelli", "capelli", CAPELLI.map(x => [x.k, x.nome]));
  h += gruppo("Colore dei capelli", "colore", COL_CAPELLI.map((c, i) => [i, "", tondo(c)]));
  h += gruppo("Faccia", "occhi", OCCHI.map(x => [x.k, x.nome]));
  h += gruppo("Maglia", "maglia", Object.entries(KIT).map(([k, x]) => [k, x.breve, tondo(x.maglia)]));
  h += gruppo("Scarpe", "scarpe", Object.entries(SCARPE).map(([k, x]) => [k, x.nome, tondo(x.c)]));
  h += gruppo("Accessorio", "acc", Object.entries(ACCESSORI).map(([k, x]) => [k, x.nome]));
  if (trofei > 0 || conTitoli) {
    h += gruppo("Sfondo della card", "sfondo", Object.entries(SFONDI).map(([k, x]) => [k, x]));
    h += gruppo("Cornice", "cornice", Object.entries(CORNICI).map(([k, x]) => [k, x]));
    if (sbloccato("effetto", "scintille", trofei)) h += gruppo("Effetto", "effetto", [["", "Nessuno"], ["scintille", "Scintille"]]);
  }
  if (conTitoli && conTitoli.length) {
    h += `<div style="margin:0 0 14px"><h3>Titolo sotto il nome</h3><div class="chips">${conTitoli.map(t => `<button class="chip${a.titolo === t ? " on" : ""}" data-act="av" data-t="titolo" data-k="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`;
  }
  h += `</section>`;
  return h;
}

function bacheca(lista) {

    let t = "", col = "var(--oro)", ic = "★";
    if (b.tipo === "mossa") { t = `<b>${esc(b.chi)}</b> ha sbloccato la mossa <b>${esc((MOSSA[b.mossa] || {}).nome || b.mossa)}</b>`; col = "var(--cielo)"; ic = "M"; }
    else if (b.tipo === "greencard") { t = `<b>${esc(b.chi)}</b> ha preso una Green Card per il fair play`; col = "var(--erba)"; ic = "G"; }
    else if (b.tipo === "nuovo") { t = `Benvenuto <b>${esc(b.chi)}</b>!`; col = "var(--gesso)"; ic = "+"; }

    return `<div class="voce"><span class="pallino" style="background:${col}">${ic}</span><div>${t}<div class="fioco piccolo">${quando(b.quando)}</div></div></div>`;
  }).join("");
}
function tStrada() {

function datiStaff() {

  const attivi = D.giocatori.filter(g => g.stato === "attivo");
  const per = {};
  for (const g of D.giocatori) per[g.id] = { ev:[], gg:[], bonus:[], boss:[] };
  for (const e of D.eventi) { if (per[e.giocatore]) per[e.giocatore].ev.push(e); if (e.tipo === "gg" && per[e.dati.a]) per[e.dati.a].gg.push(e); }
  for (const t of D.trii) if (t.bonus && per[t.giocatore] && !per[t.giocatore].bonus.includes(t.settimana)) per[t.giocatore].bonus.push(t.settimana);
  for (const m of D.boss_vinti) for (const id in per) if (per[id].ev.some(e => e.mese === m)) per[id].boss.push(m);
  const calc = {};
  for (const id in per) calc[id] = calcola(per[id].ev, per[id].gg, per[id].bonus, per[id].boss);

function datiRiep() {
  const D = S.staff, w = S.rsett === 0 ? D.ora.settimana : spostaSett(D.ora.settimana, -1);
  const ev = D.eventi.filter(e => e.settimana === w);
  const tr = D.trii.filter(t => t.settimana === w), grp = {};
  for (const t of tr) (grp[t.gruppo] = grp[t.gruppo] || []).push(t);
  const gruppi = Object.values(grp);
  const conta = t => ev.filter(e => e.tipo === t).length;
  const bambini = new Set(ev.filter(e => e.tipo === "stella").map(e => e.giocatore)).size;
  const prossima = areaMissione(spostaSett(w, 1));
  const b = bossDelMese(D.boss.mese, D.squadra.impostazioni), quota = Math.max(0, 1 - D.boss.danni / D.boss.hp);
  return { w, stelle:conta("stella"), sfide:conta("sfida"), gg:conta("gg"), mosse:conta("mossa"), gc:conta("greencard"),
           trii:gruppi.filter(g => g.every(x => x.bonus)).length, triiTot:gruppi.length, conStella:bambini, attivi:D.giocatori.filter(g => g.stato === "attivo").length,

}

function wrapTesto(x, t, X, Y, maxW, lh, maxRighe) {

  if (riga && n < maxRighe) x.fillText(riga, X, Y + n * lh);
}

    if (!/^\d{4}$/.test(pin)) { F.err = "Serve il PIN del genitore (4 cifre)."; rifai(); return; }
    const prima = S.c.record[F.k];
    try {
      await azioneRagazzo("sfida", { sfida:F.k, valore:String(+(+v).toFixed(2)), pin });
      const s = SFIDA[F.k], rec = prima != null && (s.verso > 0 ? +v > prima : +v < prima);
      chiudi(); await caricaRagazzo();
      toast(rec ? "Nuovo record! +" + (T.sfida + T.record) + " trofei" : "Sfida confermata");
    } catch (e) {
      F.err = e.message === "pin" ? `PIN sbagliato. Tentativi rimasti: ${e.r && e.r.tentativi != null ? e.r.tentativi : "pochi"}.` : msgErr(e.message); rifai();
    }
  },
  obiettivo:async d => { try { await azioneRagazzo("obiettivo", { obiettivo:d.k }); await caricaRagazzo(); } catch (e) { toast(msgErr(e.message)); } },
  cambiaObiettivo:async () => { S.io.eventi = S.io.eventi.filter(e => !(e.tipo === "obiettivo" && e.settimana === S.io.ora.settimana)); render(); },
  autoval:async d => { try { await azioneRagazzo("autovalutazione", { esito:d.k }); await caricaRagazzo(); toast("+" + T.autoval + " trofei per esserti autovalutato"); } catch (e) { toast(msgErr(e.message)); } },
  gg:d => fGG(d.id),
  mandaGG:async d => { try { await azioneRagazzo("gg", { a:d.id, frase:+d.f }); chiudi(); await caricaRagazzo(); toast("GG mandato!"); } catch (e) { toast(msgErr(e.message)); } },
  mossa:d => fMossa(d.k),
  // staff
  attiva:async () => { try { await azioneStaff("attiva"); S.stab = "squadra"; await caricaStaff(); } catch (e) { S.errore = msgErr(e.message); render(); } },
  stelleDi:d => fStelleDi(d.id),
  daiStella:async d => {
    try {
      const r = await azioneStaff("stella", { giocatore:d.id, area:d.a, frase:+d.f });
      await caricaStaff(); chiudi();
      const g = S.staff.giocatori.find(x => x.id === d.id);
      toast(`Stella ${AREA[d.a].nome.toLowerCase()} a ${g ? g.nome : ""}`, r.id);
    } catch (e) { toast(msgErr(e.message)); }
  },
  greencard:async d => { if (!confirm("Dare la Green Card? Vale " + T.greencard + " trofei.")) return; try { const r = await azioneStaff("greencard", { giocatore:d.id }); await caricaStaff(); chiudi(); toast("Green Card data", r.id); } catch (e) { toast(msgErr(e.message)); } },
  annulla:async d => {
    if (d.conferma && !confirm(d.conferma)) return;
    try { await azioneStaff("annulla", { evento:String(d.ev) }); $("toast").innerHTML = ""; await caricaStaff(); rifai(); toast("Annullato"); } catch (e) { toast(msgErr(e.message)); }
  },
  mosseDi:d => fMosseDi(d.id),
  sbloccaMossa:async d => { try { const r = await azioneStaff("mossa", { giocatore:d.id, mossa:d.k }); await caricaStaff(); rifai(); toast("Mossa sbloccata: " + MOSSA[d.k].nome, r.id); } catch (e) { toast(msgErr(e.message)); } },
  combProva:d => { fermaTimer(); S.combProva = d.k; render(); },
  cronoCombine:d => {
    const b = $("cr-" + d.id);
    if (timer && timer.id2 === d.id) { const s = (Date.now() - timer.t0) / 1000; fermaTimer(); $("cv-" + d.id).value = s.toFixed(2).replace(".", ","); if (b) b.textContent = "Via"; return; }
    if (timer) { toast("C'è già un cronometro acceso"); return; }
    const t0 = Date.now(); timer = { id2:d.id, t0, id:setInterval(() => { if (b) b.textContent = ((Date.now() - t0) / 1000).toFixed(1).replace(".", ","); }, 100) };
  },
  salvaCombine:async d => {
    const v = (($("cv-" + d.id) || {}).value || "").trim().replace(",", ".");
    if (!/^\d{1,4}(\.\d{1,2})?$/.test(v) || +v <= 0) { toast(msgErr("valore")); return; }
    try { const r = await azioneStaff("combine", { giocatore:d.id, prova:S.combProva, valore:String(+(+v).toFixed(2)) }); await caricaStaff(); toast("Salvato", r.id); } catch (e) { toast(msgErr(e.message)); }
  },
  approva:async d => { try { await azioneStaff("approva", { giocatore:d.id }); await caricaStaff(); toast("È in squadra!"); } catch (e) { toast(msgErr(e.message)); } },
  rifiuta:async d => { if (!confirm(d.conferma)) return; try { await azioneStaff("rifiuta", { giocatore:d.id }); await caricaStaff(); } catch (e) { toast(msgErr(e.message)); } },
  rsett:d => { S.rsett = +d.k; render(); disegnaRiep(); },
  condividiRiep:async () => {
    const cv = $("riepilogo"); if (!cv) return;
    await disegnaRiep();
    cv.toBlob(async blob => {
      const f = new File([blob], `ngu-settimana-${datiRiep().w}.png`, { type:"image/png" });
      try { if (navigator.canShare && navigator.canShare({ files:[f] })) { await navigator.share({ files:[f], title:"Settimana" }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); toast("Immagine scaricata");
    }, "image/png");
  },
  copiaRiep:() => condividi(testoRiep(), "Settimana"),
  salvaBoss:async () => { try { await azioneStaff("impostazioni", { premio:val("premio"), boss_nome:val("bossNome") }); await caricaStaff(); toast("Salvato"); } catch (e) { toast(msgErr(e.message)); } },
  invitoGenitori:() => {
    const D = S.staff, link = `${baseUrl()}?s=${encodeURIComponent(SQ)}&i=${D.squadra.codice_invito}`;
    condividi(`⚽ ${nomeGioco(D.squadra.impostazioni)} — il gioco della squadra ${SQ}\n\nSi guadagnano trofei con impegno, coraggio, rispetto e spirito di squadra: in allenamento, in partita e con piccole sfide a casa. Gol e vittorie non contano.\n\nPer entrare aprite questo link insieme a vostro figlio (sul suo telefono o sul vostro):\n${link}\n\nLa prima schermata è per voi: scegliete un PIN di 4 cifre, serve a confermare le sfide fatte a casa. Poi lui crea il suo Fighter con la maglia granata.\n\nNiente chat e niente foto: solo un avatar e frasi positive già pronte. Dopo l'iscrizione lo faccio entrare io.`, "Invito");
  },
  invitoMister:() => {
    const D = S.staff, link = `${baseUrl()}?s=${encodeURIComponent(SQ)}&m=${D.squadra.codice_mister}`;
    condividi(`Ciao mister! Questo è il tuo link per il gioco ${nomeGioco(D.squadra.impostazioni)}:\n${link}\n\nDopo l'allenamento bastano due minuti: tocchi un ragazzo e scegli la frase giusta (impegno, coraggio, rispetto, squadra). In cima trovi chi non ha ancora stelle nella settimana. Quando uno fa vedere bene una mossa, la sblocchi nella scheda Mosse.\n\nIl link è personale: non girarlo.`, "Mister");
  },
  nuovoInvito:async d => { if (!confirm(d.conferma)) return; try { await azioneStaff("nuovo_invito"); await caricaStaff(); toast("Nuovo codice creato"); } catch (e) { toast(msgErr(e.message)); } },
  nuovoMister:async d => { if (!confirm(d.conferma)) return; try { await azioneStaff("nuovo_mister"); await caricaStaff(); toast("Nuovo codice mister creato: rimanda il messaggio"); } catch (e) { toast(msgErr(e.message)); } },
  gestisci:d => fGestisci(d.id),
  nuovoLink:async d => {
    try {
      const r = await azioneStaff("nuovo_link", { giocatore:d.id }), g = S.staff.giocatori.find(x => x.id === d.id);
      condividi(`Nuovo link personale di ${g.soprannome} per ${nomeGioco(S.staff.squadra.impostazioni)}:\n${baseUrl()}?s=${encodeURIComponent(SQ)}&t=${r.token}\n\nApritelo sul telefono che usa vostro figlio e aggiungetelo alla schermata Home. Il vecchio link non funziona più.`, "Link");
    } catch (e) { toast(msgErr(e.message)); }
  },
  nuovoPin:async d => { const p = val("nuovoPin"); if (!/^\d{4}$/.test(p)) { toast("Il PIN ha 4 cifre"); return; } try { await azioneStaff("nuovo_pin", { giocatore:d.id, pin:p }); await caricaStaff(); chiudi(); toast("PIN impostato: comunicalo al genitore"); } catch (e) { toast(msgErr(e.message)); } },
  nuovoSopr:async d => { try { await azioneStaff("soprannome", { giocatore:d.id, soprannome:val("nuovoSopr") }); await caricaStaff(); chiudi(); toast("Soprannome cambiato"); } catch (e) { toast(msgErr(e.message)); } },
  sospendi:async d => { if (!confirm(d.conferma)) return; try { await azioneStaff("sospendi", { giocatore:d.id }); await caricaStaff(); chiudi(); } catch (e) { toast(msgErr(e.message)); } },
  riattiva:async d => { try { await azioneStaff("riattiva", { giocatore:d.id }); await caricaStaff(); chiudi(); } catch (e) { toast(msgErr(e.message)); } },
  elimina:async d => { if (!confirm(d.conferma)) return; try { await azioneStaff("elimina", { giocatore:d.id }); await caricaStaff(); chiudi(); toast("Eliminato"); } catch (e) { toast(msgErr(e.message)); } },
  salvaImp:async () => {
    try { await azioneStaff("impostazioni", { figlio:val("figlio"), nome_gioco:val("nomeGioco"), hp:val("hp") }); await caricaStaff(); toast("Impostazioni salvate"); }
    catch (e) { toast(msgErr(e.message)); }
  },
  backup:() => {
    const blob = new Blob([JSON.stringify(S.staff, null, 1)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ngu-${SQ}-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  }
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.dataset.act !== "velo" && el.dataset.act !== "chiudiFesta") ev.stopPropagation();
  f(el.dataset, el, ev);
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.foglio) chiudi(); });

async function avviaIscrizione(codice) {
  S.modo = "iscrizione"; S.errore = "";
  S.iscr = { codice, passo:0, pub:null, av:{ ...AV_BASE } };
  render();
  try {
    const r = await rpc("gioco_pubblico", { p_squadra:SQ, p_invito:codice });
    if (r.errore) throw new Error(r.errore);
    S.iscr.pub = r; render();
  } catch (e) { S.modo = "benvenuto"; S.errore = msgErr(e.message); render(); toast(msgErr(e.message)); }
}

/* ---------- icona e "Aggiungi a schermata Home" ---------- */
let iconaPng = null;
async function icona() {
  if (iconaPng) return iconaPng;
  try { await document.fonts.load('80px "Lilita One"'); } catch (e) {}
  const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
  x.fillStyle = "#3B0F0E"; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 512; i += 64) { x.fillStyle = "#922F29"; x.fillRect(i, 0, 32, 512); }
  x.font = '190px "Lilita One","Arial Rounded MT Bold",sans-serif'; x.textAlign = "center"; x.lineJoin = "round";
  x.lineWidth = 26; x.strokeStyle = "#1E0B0A"; x.strokeText("NGU", 256, 300); x.fillStyle = "#FFC531"; x.fillText("NGU", 256, 300);
  x.font = '64px "Lilita One","Arial Rounded MT Bold",sans-serif'; x.lineWidth = 12; x.strokeText(SQ, 256, 400); x.fillStyle = "#FFFFFF"; x.fillText(SQ, 256, 400);
  iconaPng = c.toDataURL("image/png");
  return iconaPng;
}
async function manifest() {
  try {
    const src = await icona();
    $("ati").href = src;
    let start = `${baseUrl()}?s=${encodeURIComponent(SQ)}`;
    if (S.modo === "ragazzo" || S.modo === "attesa") start += "&t=" + S.token;
    else if (S.modo === "staff" && S.staff && S.staff.ruolo === "mister") start += "&m=" + encodeURIComponent(S.chiave);
    const mf = { name:"NEVER GIVE UP · " + SQ, short_name:"NGU " + SQ, start_url:start, scope:baseUrl(), display:"standalone",
                 background_color:"#3B0F0E", theme_color:"#3B0F0E", icons:[{ src, sizes:"512x512", type:"image/png" }] };
    $("mf").href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type:"application/json" }));
  } catch (e) {}
}

/* ---------- avvio ---------- */
(function avvio() {
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) { S.modo = "benvenuto"; S.errore = "Manca la configurazione del server."; render(); return; }
  const invito = P.get("i");
  if (P.get("m") || P.get("staff") === "1") { if (S.chiave) { caricaStaff(); } else { S.modo = "login"; render(); } return; }
  if (S.token) { caricaRagazzo().then(() => { if (S.modo === "attesa") controllaAttesa(); }); return; }
  if (invito) { avviaIscrizione(invito.toUpperCase()); return; }
  if (S.chiave) { caricaStaff(); return; }
  S.modo = "benvenuto"; render();
})();
</script>
