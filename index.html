function computeStats(roster, matches) {

      rMin += minutiPartita(m, p.id);
    }
    return {
      ...p,
      presenze,
      convocazioni,
      tempi,
      gol,
      minuti: Math.round(minuti),
      dispTempi,
      dispMin,
      impiego: dispMin ? Math.round(minuti / dispMin * 100) : 0,
      mediaMin: presenze ? minuti / presenze : 0,
      tassoConv: gareTot ? Math.round(convocazioni / gareTot * 100) : 0,

    n: 0,
    p: 0,
    gf: 0,
    gs: 0
  };
  for (const m of done) {
    const [u, th] = scoreOf(m);
    const b = byType[m.type];

    b.gf += u;
    b.gs += th;
    gf += u;
    gs += th;
    const o = outcome(m);
    if (o === "V") {
      b.v++;
      v++;
    } else if (o === "P") {
      b.p++;
      s2++;
    } else {
      b.n++;
      n++;
    }
  }

  // dati di squadra, quelli che vedono tutti
  const maxP = Math.max(2, ...done.map(m => m.periods || 3));
  const perTempo = Array.from({
    length: maxP
  }, (_, i) => ({
    p: i + 1,
    fatti: 0,
    subiti: 0

  let cleanSheet = 0;
  const avversari = new Set(),
    tornei = new Set();
  let tuttiDue = 0,

  for (const m of done) {
    for (const g of m.goals) {
      const r = perTempo[(g.period || 1) - 1];
      if (r) g.team === "us" ? r.fatti++ : r.subiti++;

    if (scoreOf(m)[1] === 0) cleanSheet++;
    if (m.opponent) avversari.add(m.opponent.trim().toLowerCase());
    if (m.type === "torneo" && m.tournament) tornei.add(m.tournament.trim().toLowerCase());

  const inRete = per.filter(p => p.gol > 0).map(p => p.name).sort((a, b) => a.localeCompare(b));
  return {
    per,
    byType,
    total: done.length,
    gf,
    gs,
    v,
    n,
    s: s2,
    gareTot,
    maxPeriodi,
    minutiSquadra,
    ultimeQuante: ultime.length,
    ultimaGara: ordinate[0] || null,
    perTempo,
    cleanSheet,
    avversari: avversari.size,
    tornei: tornei.size,
    tuttiDue,
    valutabili,
    convocatiMai,
    inRete
  };
}

/* Google Calendar: dal ritrovo all'ultima partita (+1 ora); senza orari, giornata intera */
function linkCalendarioTorneo(t, partite) {
  const titolo = "⚽ 🏅 TORNEO – " + (t.nome || "Torneo") + (t.home ? " (in casa)" : "");

  const orari = [t.meetTime, ...partite.filter(m => !m.date || m.date === t.date).map(m => m.kickoffTime)].filter(x => /^\d{1,2}:\d{2}$/.test(x || "")).sort();
  const f = x => x.getFullYear() + String(x.getMonth() + 1).padStart(2, "0") + String(x.getDate()).padStart(2, "0") + "T" + String(x.getHours()).padStart(2, "0") + String(x.getMinutes()).padStart(2, "0") + "00";
  let dates = "";
  if (d && orari.length) {
    const y = Number(d.slice(0, 4)),
      mo = Number(d.slice(4, 6)) - 1,
      g = Number(d.slice(6, 8));
    const [h1, m1] = orari[0].split(":").map(Number);
    const [h2, m2] = orari[orari.length - 1].split(":").map(Number);
    const ini = new Date(y, mo, g, h1, m1);
    const fine = new Date(new Date(y, mo, g, h2, m2).getTime() + 60 * 60000);
    dates = f(ini) + "/" + f(fine.getTime() - ini.getTime() < 90 * 60000 ? new Date(ini.getTime() + 4 * 3600000) : fine);
  } else if (d) {
    const y = Number(d.slice(0, 4)),
      mo = Number(d.slice(4, 6)) - 1,
      g = Number(d.slice(6, 8));
    const dopo = new Date(y, mo, g + 1);
    dates = d + "/" + dopo.getFullYear() + String(dopo.getMonth() + 1).padStart(2, "0") + String(dopo.getDate()).padStart(2, "0");
  }
  const det = [];
  if (t.meetTime) det.push("Ritrovo " + t.meetTime);
  partite.forEach(m => det.push(rigaPartita(m)));
  det.push("Torneo · " + CLUB + " " + CAT);
  if (t.notes) det.push("Da portare: " + t.notes);
  const p = new URLSearchParams({
    action: "TEMPLATE",
    text: titolo,
    details: det.join("\n"),
    ctz: "Europe/Rome"
  });
  if (dates) p.set("dates", dates);
  if (t.address) p.set("location", t.address);
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

/* immagine della convocazione del torneo: stesse righe del testo */
function disegnaTorneo(c, logo, t, partite, players, meteo) {
  const W = 1080,
    rows = Math.ceil(players.length / 2);
  const Hh = 760 + rows * 64 + (t.notes ? 170 : 0) + (t.address ? 46 : 0) + (meteo ? 46 : 0) + (partite.length ? 90 + partite.length * 58 : 0);
  c.width = W;
  c.height = Hh;
  const x = c.getContext("2d");
  if (!x) return null;
  const F = (s, w = 400) => `${w} ${s}px Helvetica,Arial,sans-serif`;
  const scrivi = (testo, px, py, max) => {
    let s = String(testo);
    while (s.length > 3 && x.measureText(s).width > max) s = s.slice(0, -2);
    if (s !== String(testo)) s = s.replace(/\s+$/, "") + "…";
    x.fillText(s, px, py);
  };
  x.fillStyle = "#fff";
  x.fillRect(0, 0, W, Hh);
  x.fillStyle = C.gr;
  x.fillRect(0, 0, W, 18);
  x.fillRect(0, Hh - 18, W, 18);
  if (logo) x.drawImage(logo, 70, 70, 150, 162);
  x.fillStyle = C.gr;
  x.font = F(48, 800);
  x.fillText(CLUB, 255, 135);
  x.fillStyle = C.dim;
  x.font = F(32, 500);
  x.fillText("Convocazione torneo · " + CAT, 255, 190);
  let y = 300;
  x.strokeStyle = C.line;
  x.lineWidth = 2;
  x.beginPath();
  x.moveTo(70, y);
  x.lineTo(W - 70, y);
  x.stroke();
  y += 78;
  x.fillStyle = C.gr;
  x.font = F(58, 800);
  scrivi(t.nome || "Torneo", 70, y, W - 140);
  y += 56;
  x.fillStyle = C.txt;
  x.font = F(34, 500);
  x.fillText(cap(fmtLong(t.date)), 70, y);
  y += 50;
  x.fillStyle = C.dim;
  x.font = F(32, 500);
  x.fillText(t.home ? "In casa" : "Fuori casa", 70, y);
  if (t.address) {
    y += 46;
    x.fillStyle = C.txt;
    scrivi(t.address, 70, y, W - 140);
  }
  if (meteo) {
    y += 46;
    x.fillStyle = C.txt;
    adatta(x, meteoRiga(meteo), W - 140, 30, 500);
    x.fillText(meteoRiga(meteo), 70, y);
    x.font = F(32, 500);
  }
  y += 44;
  x.fillStyle = C.tint;
  x.fillRect(70, y, 940, 110);
  x.fillStyle = C.dim;
  x.font = F(28, 600);
  x.fillText("Ritrovo", 100, y + 66);
  x.fillStyle = C.gr;
  x.font = F(50, 800);
  x.fillText(t.meetTime || "—", 300, y + 72);
  y += 170;
  if (partite.length) {
    x.fillStyle = C.dim;
    x.font = F(30, 600);
    x.fillText("Partite (" + partite.length + ")", 70, y);
    y += 56;
    x.font = F(34, 600);
    partite.forEach(m => {
      x.fillStyle = C.txt;
      scrivi("• " + (m.date && m.date !== t.date ? fmtDate(m.date) + " · " : "") + rigaPartita(m), 70, y, W - 140);
      y += 58;
    });
    y += 34;
  }
  x.fillStyle = C.dim;
  x.font = F(30, 600);
  x.fillText(`Convocati (${players.length})`, 70, y);
  y += 54;
  x.font = F(34, 600);
  players.forEach((p, i) => {
    x.fillStyle = C.txt;
    scrivi("• " + p.name, 70 + i % 2 * 490, y + Math.floor(i / 2) * 64, 460);
  });
  y += rows * 64 + 20;
  if (t.notes) {
    x.fillStyle = C.dim;
    x.font = F(28, 600);
    x.fillText("Da portare", 70, y + 26);
    x.fillStyle = C.txt;
    x.font = F(32, 500);
    let line = "",
      ly = y + 76;
    for (const w of t.notes.split(" ")) {
      if (x.measureText(line + w).width > W - 140) {
        x.fillText(line, 70, ly);
        line = w + " ";
        ly += 42;
      } else line += w + " ";
    }
    x.fillText(line, 70, ly);
  }
  try {
    return c.toDataURL("image/png");
  } catch (e) {
    return null;
  }
}
