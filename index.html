  Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json" });

async function cloudLoad() {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/stato?id=eq.${CONFIG.SQUADRA_ID}&select=dati`, { headers: H() });
  if (!r.ok) throw new Error("lettura non riuscita");
  const rows = await r.json();
  return rows[0] ? rows[0].dati : null;
}
async function cloudSave(db, chiave) {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/salva_stato`, {
    method:"POST", headers:H(),
    body: JSON.stringify({ p_id: CONFIG.SQUADRA_ID, p_chiave: chiave || "", p_dati: db })
  });
  if (!r.ok) throw new Error(r.status === 400 ? "chiave di scrittura non valida" : "salvataggio non riuscito");
}
function localLoad(){ try { const r = localStorage.getItem(LKEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function localSave(db){ try { localStorage.setItem(LKEY, JSON.stringify(db)); } catch(e){} }

function download(content, filename, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
}

/* ---------------- testo convocazione ---------------- */

function buildText(m, roster) {
  const players = roster.filter(p=>m.squad.includes(p.id));
  const L=[];
  L.push(`⚽ *${CLUB}* — Convocazione`);
  L.push(`${typeOf(m).emoji} ${typeLabel(m)}`);
  L.push("");
  L.push(`📅 ${cap(fmtLong(m.date))}`);
  if (m.opponent) L.push(`🆚 ${m.opponent}`);
  L.push(m.home ? "🏟️ In casa" : "✈️ In trasferta");
  if (m.address) { L.push(`📍 ${m.address}`); L.push(`🗺️ https://maps.google.com/?q=${encodeURIComponent(m.address)}`); }
  if (m.meetTime) L.push(`⏰ Ritrovo ${m.meetTime}`);
  if (m.kickoffTime) L.push(`🕐 Inizio gara ${m.kickoffTime}`);
  L.push("");
  L.push(`👕 *Convocati (${players.length})*`);
  players.forEach(p=>L.push(`• ${p.name}`));
  if (m.notes) { L.push(""); L.push(`🎒 Da portare: ${m.notes}`); }
  return L.join("\n");
}

/* ---------------- statistiche ---------------- */

function computeStats(roster, matches) {
  const done = matches.filter(m=>m.status==="done");
  const per = roster.map(p=>{
    let tempi=0, gol=0, presenze=0, convocazioni=0, disponibili=0;
    for (const m of done) {
      if (!m.squad.includes(p.id)) continue;
      convocazioni++; disponibili += m.periods;
      const t = (m.lineup[p.id]||[]).length;
      if (t>0) presenze++;
      tempi += t;
      gol += m.goals.filter(g=>g.playerId===p.id).length;
    }
    return { ...p, presenze, convocazioni, tempi, disponibili, gol,
      impiego: disponibili ? Math.round(tempi/disponibili*100) : 0,
      mediaTempi: presenze ? (tempi/presenze) : 0 };
  });
  const byType = {}; let gf=0, gs=0, v=0, n=0, s=0;
  for (const t of TYPES) byType[t.id] = { v:0, n:0, p:0, gf:0, gs:0 };
  for (const m of done) {
    const [u,th]=scoreOf(m); const b=byType[m.type]; if(!b) continue;
    b.gf+=u; b.gs+=th; gf+=u; gs+=th;
    const o=outcome(m);
    if(o==="V"){b.v++;v++;} else if(o==="P"){b.p++;s++;} else {b.n++;n++;}
  }
  return { per, byType, total: done.length, gf, gs, v, n, s };
}

function Btn({children,onClick,tone="quiet",style,disabled}) {
  const t = { solid:{background:C.gr,color:"#fff",border:"1px solid "+C.gr},
              quiet:{background:"#fff",color:C.txt,border:"1px solid "+C.line},
              ghost:{background:"transparent",color:C.dim,border:"1px solid "+C.line} }[tone];
  return <button onClick={onClick} disabled={disabled} style={{...t,borderRadius:10,padding:"12px 14px",
    fontSize:15,fontWeight:600,cursor:"pointer",opacity:disabled?0.4:1,...style}}>{children}</button>;
}
function Field({label,children}) {
  return <div className="mb4"><div style={{color:C.dim,fontSize:13,marginBottom:6}}>{label}</div>{children}</div>;
}
const inp = { width:"100%", background:C.sur, border:"1px solid "+C.line, borderRadius:10,
  color:C.txt, padding:"12px 14px", fontSize:16 };

function Seg({options,value,onChange,disabled}) {
  return <div className="flex gap2">{options.map(o=>{ const on=value===o.v;
    return <button key={String(o.v)} disabled={disabled} onClick={()=>onChange(o.v)}
      style={{flex:1,padding:"12px 4px",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",
        background:on?C.gr:"#fff",color:on?"#fff":C.dim,border:"1px solid "+(on?C.gr:C.line),opacity:disabled?0.6:1}}>
      {o.l}</button>; })}</div>;
}
function Dots({played,total,color}) {
  return <span className="flex gap1 ic">{Array.from({length:total}).map((_,i)=>
    <span key={i} style={{width:6,height:6,borderRadius:6,background:i<played?color:"transparent",
      border:"1px solid "+(i<played?color:"rgba(138,122,120,.5)")}} />)}</span>;
}
function Header({title,sub,onBack,right}) {

function Sheet({children,onClose,title}) {

/* ---------------- convocazione: dettaglio ---------------- */

function ConvDetail({match,roster,onBack,onEdit,onStart,onDelete,readOnly}) {
  const [copied,setCopied]=useState(false);
  const [img,setImg]=useState("");
  const [ask,setAsk]=useState(false);
  const [periods,setPeriods]=useState(match.periods||3);
  const cv=useRef(null);
  const players=roster.filter(p=>match.squad.includes(p.id));
  const text=buildText(match,roster);

  useEffect(()=>{
    const im=new Image(); im.onload=()=>render(im); im.onerror=()=>render(null); im.src=LOGO;
    function render(logo){
      const c=cv.current; if(!c) return;
      const W=1080, rows=Math.ceil(players.length/2);
      const Hh=900+rows*64+(match.notes?150:0)+(match.address?50:0);
      c.width=W; c.height=Hh; const x=c.getContext("2d");
      const F=(s,w=400)=>`${w} ${s}px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
      x.fillStyle="#fff"; x.fillRect(0,0,W,Hh);
      x.fillStyle=C.gr; x.fillRect(0,0,W,18); x.fillRect(0,Hh-18,W,18);
      if(logo) x.drawImage(logo,70,70,150,162);
      x.fillStyle=C.gr; x.font=F(48,800); x.fillText(CLUB,255,135);
      x.fillStyle=C.dim; x.font=F(32,500); x.fillText(`Convocazione · ${typeLabel(match)}`,255,190);
      let y=300; x.strokeStyle=C.line; x.lineWidth=2; x.beginPath(); x.moveTo(70,y); x.lineTo(W-70,y); x.stroke();
      y+=78; x.fillStyle=C.gr; x.font=F(62,800); x.fillText(match.opponent||"Avversario",70,y);
      y+=56; x.fillStyle=C.txt; x.font=F(34,500); x.fillText(cap(fmtLong(match.date)),70,y);
      y+=50; x.fillStyle=C.dim; x.font=F(32,500); x.fillText(match.home?"In casa":"In trasferta",70,y);
      if(match.address){ y+=46; x.fillStyle=C.txt; x.fillText(match.address,70,y); }
      y+=44; x.fillStyle=C.tint; x.fillRect(70,y,450,130); x.fillRect(560,y,450,130);
      x.fillStyle=C.dim; x.font=F(28,600); x.fillText("Ritrovo",100,y+48); x.fillText("Inizio gara",590,y+48);
      x.fillStyle=C.gr; x.font=F(50,800); x.fillText(match.meetTime||"—",100,y+105); x.fillText(match.kickoffTime||"—",590,y+105);
      y+=200; x.fillStyle=C.dim; x.font=F(30,600); x.fillText(`Convocati (${players.length})`,70,y);
      y+=54; x.font=F(34,600);
      players.forEach((p,i)=>{ x.fillStyle=C.txt; x.fillText("• "+p.name, 70+(i%2)*490, y+Math.floor(i/2)*64); });
      y+=rows*64+20;
      if(match.notes){ x.fillStyle=C.dim; x.font=F(28,600); x.fillText("Da portare",70,y+26);
        x.fillStyle=C.txt; x.font=F(32,500); let line="",ly=y+76;
        for(const w of match.notes.split(" ")){ if(x.measureText(line+w).width>W-140){ x.fillText(line,70,ly); line=w+" "; ly+=42; } else line+=w+" "; }
        x.fillText(line,70,ly); }
      try { setImg(c.toDataURL("image/png")); } catch(e){}
    }
  },[match,roster.length]);

  const copy=()=>{ try{ navigator.clipboard.writeText(text); setCopied(true); setTimeout(()=>setCopied(false),2000);}catch(e){} };

  return <><Header title="Convocazione" sub={CLUB} onBack={onBack}/>
  <div className="px4 py5">
    <div style={{background:C.sur,border:"1px solid "+C.line,borderRadius:14,padding:16,whiteSpace:"pre-wrap",fontSize:15,lineHeight:1.6}}>{text}</div>
    <div className="grid g2 gap2 mt4 noprint">
      <Btn tone="solid" onClick={copy}>{copied?"Copiato":"Copia testo"}</Btn>
      {img ? <a href={img} download={`convocazione-${match.date}.png`}
        style={{background:"#fff",color:C.txt,border:"1px solid "+C.line,borderRadius:10,padding:"12px 14px",
          fontSize:15,fontWeight:600,textAlign:"center",textDecoration:"none"}}>Scarica immagine</a>
        : <Btn disabled>Immagine…</Btn>}
    </div>
    <canvas ref={cv} style={{width:"100%",marginTop:12,borderRadius:14,border:"1px solid "+C.line}}/>
    {!readOnly && <>
      <div className="grid g2 gap2 mt5">
        <Btn onClick={onEdit}>Modifica</Btn><Btn tone="ghost" onClick={onDelete}>Elimina</Btn>
      </div>
      <div className="mt3"><Btn tone="solid" onClick={()=>setAsk(true)} style={{width:"100%",padding:"16px 0"}}>Inizia la partita</Btn></div>
    </>}
  </div>
  {ask && <Sheet onClose={()=>setAsk(false)} title="Quanti tempi si gioca?">
    <div style={{color:C.dim,fontSize:13,marginBottom:12}}>Puoi cambiarlo anche a gara iniziata.</div>
    <Seg options={[2,3,4].map(n=>({v:n,l:`${n} tempi`}))} value={periods} onChange={setPeriods}/>
    <div className="mt4"><Btn tone="solid" onClick={()=>onStart(periods)} style={{width:"100%",padding:"16px 0"}}>Vai</Btn></div>
  </Sheet>}
  </>;
}

/* ---------------- partita ---------------- */

function LiveMatch({match,roster,update,finish,onBack,readOnly}) {
  const [picker,setPicker]=useState(false);
  const [settings,setSettings]=useState(false);
  const period = match.cur || 1;
  const [us,them]=scoreOf(match);
  const squad=roster.filter(p=>match.squad.includes(p.id));
  const playedIn=(pid,per)=>(match.lineup[pid]||[]).includes(per);
  const tempiOf=pid=>(match.lineup[pid]||[]).length;
  const setPeriod = n => update({...match, cur:n});

  function togglePlayer(pid){ if(readOnly) return;
    const cur=match.lineup[pid]||[];
    update({...match, lineup:{...match.lineup,[pid]: cur.includes(period)?cur.filter(z=>z!==period):[...cur,period]}}); }
  function setPeriods(n){ const lineup={};
    for(const k of Object.keys(match.lineup)) lineup[k]=(match.lineup[k]||[]).filter(p=>p<=n);
    update({...match, periods:n, lineup, cur:Math.min(period,n), goals:match.goals.filter(g=>g.period<=n)}); }
  function addGoal(team,playerId){ if(readOnly) return;
    update({...match, goals:[...match.goals,{id:uid(),team,playerId:playerId||null,period}]}); setPicker(false); }

  const hard=[],soft=[];
  if(period>=2 && match.periods>=3) for(const p of squad)
    if(!playedIn(p.id,1)&&!playedIn(p.id,2)) hard.push(`${p.name}: nessuno dei primi due tempi`);
  if(period>=match.periods) for(const p of squad){ const t=tempiOf(p.id);
    if(t<2) soft.push(`${p.name}: solo ${t} ${t===1?"tempo":"tempi"}`);
    if(match.periods===4&&t>3) hard.push(`${p.name}: più di 3 tempi`); }

  return <div className="pb6">
    <Header title={match.opponent||"Avversario"}
      sub={`${typeLabel(match)} · ${fmtDate(match.date)} · ${match.home?"casa":"trasferta"}`}
      onBack={onBack}
      right={!readOnly && <button onClick={()=>setSettings(true)} style={{background:"rgba(255,255,255,.18)",
        border:"none",color:"#fff",borderRadius:8,padding:"8px 12px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Gara</button>}/>

    <div className="flex ie jc gap3 px4 pt6 pb4">
      <div className="tc"><div style={{fontSize:68,fontWeight:800,lineHeight:1,letterSpacing:-3,color:C.gr}} className="num">{us}</div>
        <div style={{color:C.dim,fontSize:13,marginTop:4}}>noi</div></div>
      <div style={{color:C.line,fontSize:40,fontWeight:300,paddingBottom:18}}>–</div>
      <div className="tc"><div style={{fontSize:68,fontWeight:800,lineHeight:1,letterSpacing:-3,color:C.dim}} className="num">{them}</div>
        <div style={{color:C.dim,fontSize:13,marginTop:4}}>loro</div></div>
    </div>

    {!readOnly && <div className="grid g2 gap3 px4">
      <Btn tone="solid" onClick={()=>setPicker(true)} style={{padding:"16px 0"}}>Gol nostro</Btn>
      <Btn onClick={()=>addGoal("them")} style={{padding:"16px 0"}}>Gol loro</Btn>
    </div>}

    <div className="px4 pt6">
      <div style={{color:C.dim,fontSize:13,marginBottom:8}}>Tempo in corso</div>
      <Seg disabled={readOnly} options={Array.from({length:match.periods}).map((_,i)=>({v:i+1,l:`${i+1}º`}))} value={period} onChange={setPeriod}/>
    </div>

    <div className="px4 pt5">
      <div style={{color:C.dim,fontSize:13,marginBottom:8}}>
        {readOnly ? `In campo nel ${period}º tempo` : `In campo nel ${period}º tempo — tocca per segnare`}</div>
      <div className="grid g2 gap2">{squad.map(p=>{ const on=playedIn(p.id,period);
        const gol=match.goals.filter(g=>g.playerId===p.id).length;
        return <button key={p.id} onClick={()=>togglePlayer(p.id)} style={{textAlign:"left",padding:12,borderRadius:12,
          cursor:readOnly?"default":"pointer",background:on?C.gr:"#fff",color:on?"#fff":C.txt,border:"1px solid "+(on?C.gr:C.line)}}>
          <div className="flex ic jb"><span style={{fontSize:15,fontWeight:700}}>{p.name}</span>
            {gol>0 && <span style={{fontSize:13,opacity:.85}}>{gol}⚽</span>}</div>
          <div className="mt2"><Dots played={tempiOf(p.id)} total={match.periods} color={on?"#fff":C.gr}/></div>
        </button>; })}</div>
    </div>

    {!readOnly && (hard.length>0||soft.length>0) && <div className="px4 pt5">
      {hard.length>0 && <div style={{background:C.gr,color:"#fff",borderRadius:12,padding:14,marginBottom:10}}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:6}}>Regola sui tempi</div>
        {hard.map((w,i)=><div key={i} style={{fontSize:14}}>{w}</div>)}</div>}
      {soft.length>0 && <div style={{background:C.sur,border:"1px solid "+C.line,borderRadius:12,padding:14}}>
        <div style={{color:C.warn,fontSize:14,fontWeight:800,marginBottom:6}}>Sotto i due tempi</div>
        {soft.map((w,i)=><div key={i} style={{fontSize:14}}>{w}</div>)}</div>}
    </div>}

    {match.goals.length>0 && <div className="px4 pt5">
      <div style={{color:C.dim,fontSize:13,marginBottom:8}}>Gol segnati</div>
      {match.goals.map(g=>{ const p=roster.find(z=>z.id===g.playerId);
        return <div key={g.id} className="flex ic jb py2" style={{borderBottom:"1px solid "+C.line}}>
          <span style={{fontSize:15}}><span style={{color:g.team==="us"?C.gr:C.dim,fontWeight:700}}>{g.team==="us"?"Noi":"Loro"}</span>{" "}
            {g.team==="us"?(p?p.name:"non assegnato"):""} · {g.period}º tempo</span>
          {!readOnly && <button onClick={()=>update({...match,goals:match.goals.filter(z=>z.id!==g.id)})}
            style={{background:"none",border:"none",color:C.dim,fontSize:14,cursor:"pointer"}}>annulla</button>}
        </div>; })}
    </div>}

    {!readOnly && <div className="px4 pt6">
      <Btn tone="solid" onClick={finish} style={{width:"100%",padding:"16px 0"}}>Chiudi la partita</Btn></div>}

    {picker && <Sheet onClose={()=>setPicker(false)} title="Chi ha segnato?">
      <div className="grid g2 gap2">{squad.map(p=><Btn key={p.id} onClick={()=>addGoal("us",p.id)}>{p.name}</Btn>)}</div>
      <div className="mt3"><Btn tone="ghost" onClick={()=>addGoal("us",null)} style={{width:"100%"}}>Non assegnato</Btn></div>
    </Sheet>}

    {settings && <Sheet onClose={()=>setSettings(false)} title="Gara">
      <div style={{color:C.dim,fontSize:13,marginBottom:8}}>Numero di tempi</div>
      <Seg options={[2,3,4].map(n=>({v:n,l:`${n} tempi`}))} value={match.periods} onChange={setPeriods}/>
      <div style={{color:C.dim,fontSize:13,margin:"18px 0 8px"}}>Convocati — puoi aggiungere o togliere ragazzi anche a partita iniziata</div>
      <SquadPicker roster={roster} squad={match.squad} setSquad={s=>update({...match,squad:s})}/>
      <div className="mt4"><Btn tone="solid" onClick={()=>setSettings(false)} style={{width:"100%"}}>Fatto</Btn></div>
    </Sheet>}
  </div>;
}

  <div className="px4 py5">
    {!readOnly && <Btn tone="solid" onClick={create} style={{width:"100%",padding:"16px 0",marginBottom:18}}>Nuova convocazione</Btn>}
    {readOnly && live && <div style={{background:C.tint,border:"1px solid "+C.gr,borderRadius:12,padding:12,marginBottom:16,fontSize:14}}>
      Partita in corso — la pagina si aggiorna da sola ogni 10 secondi.</div>}
    {!list.length && <div style={{color:C.dim,fontSize:15}}>Nessuna gara in programma.</div>}
    {list.map(m=><button key={m.id} onClick={()=>open(m.id)} style={{display:"block",width:"100%",textAlign:"left",
      background:m.status==="live"?C.tint:C.sur,border:"1px solid "+(m.status==="live"?C.gr:C.line),
      borderRadius:12,padding:14,marginBottom:10,color:C.txt,cursor:"pointer"}}>
      <div className="flex ic jb"><span style={{fontSize:16,fontWeight:700}}>{m.opponent||"Avversario"}</span>
        {m.status==="live" && <span style={{color:C.gr,fontSize:12,fontWeight:800}}>in corso · {scoreOf(m)[0]}–{scoreOf(m)[1]}</span>}</div>
      <div style={{color:C.dim,fontSize:13,marginTop:4}}>{cap(fmtLong(m.date))} · {typeLabel(m)}</div>
      <div style={{color:C.dim,fontSize:13,marginTop:2}}>{m.home?"In casa":"In trasferta"}
        {m.meetTime?` · ritrovo ${m.meetTime}`:""} · {m.squad.length} convocati</div>
    </button>)}
  </div></>;
}

/* ---------------- storico ---------------- */

function History({matches,roster,reopen,remove,readOnly}) {
  const [filter,setFilter]=useState("tutte");
  const list=matches.filter(m=>m.status==="done").filter(m=>filter==="tutte"||m.type===filter)
    .slice().sort((a,b)=>a.date<b.date?1:-1);
  return <><Header title="Storico" sub={CLUB}/>
  <div className="px4 py5">
    <div className="flex gap2 mb4">{["tutte",...TYPES.map(t=>t.id)].map(f=>
      <button key={f} onClick={()=>setFilter(f)} style={{flex:1,padding:"10px 0",borderRadius:10,fontSize:13,fontWeight:700,
        cursor:"pointer",background:filter===f?C.tint:"#fff",color:filter===f?C.gr:C.dim,
        border:"1px solid "+(filter===f?C.gr:C.line),textTransform:"capitalize"}}>{f}</button>)}</div>
    {!list.length && <div style={{color:C.dim,fontSize:15}}>Nessuna partita chiusa finora.</div>}
    {list.map(m=>{ const [u,t]=scoreOf(m); const o=outcome(m);
      const col=o==="V"?C.gr:o==="P"?C.dim:C.warn;
      const sc=m.goals.filter(g=>g.team==="us"&&g.playerId).map(g=>(roster.find(p=>p.id===g.playerId)||{}).name).filter(Boolean);
      return <div key={m.id} style={{background:C.sur,border:"1px solid "+C.line,borderLeft:"3px solid "+col,
        borderRadius:12,padding:14,marginBottom:10}}>
        <div className="flex ic jb"><div>
          <div style={{fontSize:16,fontWeight:700}}>{m.opponent||"Avversario"}</div>
          <div style={{color:C.dim,fontSize:13,marginTop:2}}>{fmtDate(m.date)} · {typeLabel(m)} · {m.periods} tempi</div></div>
          <div className="num" style={{fontSize:24,fontWeight:800,color:col}}>{u}–{t}</div></div>
        {sc.length>0 && <div style={{color:C.dim,fontSize:13,marginTop:8}}>Gol: {sc.join(", ")}</div>}
        {!readOnly && <div className="flex gap2 mt3">
          <Btn tone="ghost" onClick={()=>reopen(m.id)} style={{flex:1,padding:"9px 0",fontSize:13}}>Riapri</Btn>
          <Btn tone="ghost" onClick={()=>remove(m.id)} style={{padding:"9px 14px",fontSize:13}}>Elimina</Btn></div>}
      </div>; })}
  </div></>;
}

/* ---------------- statistiche ---------------- */

function Stats({roster,matches}) {
  const s = useMemo(()=>computeStats(roster,matches),[roster,matches]);
  const [img,setImg]=useState("");
  const cv=useRef(null);
  const ord=[...s.per].sort((a,b)=>b.tempi-a.tempi||a.name.localeCompare(b.name));
  const maxT=Math.max(1,...ord.map(p=>p.tempi));
  const marcatori=[...s.per].filter(p=>p.gol>0).sort((a,b)=>b.gol-a.gol);

  useEffect(()=>{
    const im=new Image(); im.onload=()=>render(im); im.onerror=()=>render(null); im.src=LOGO;
    function render(logo){
      const c=cv.current; if(!c) return;
      const W=1080, Hh=460+ord.length*62+140;
      c.width=W; c.height=Hh; const x=c.getContext("2d");
      const F=(sz,w=400)=>`${w} ${sz}px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
      x.fillStyle="#fff"; x.fillRect(0,0,W,Hh);
      x.fillStyle=C.gr; x.fillRect(0,0,W,18); x.fillRect(0,Hh-18,W,18);
      if(logo) x.drawImage(logo,70,60,140,151);
      x.fillStyle=C.gr; x.font=F(46,800); x.fillText(CLUB,245,120);
      x.fillStyle=C.dim; x.font=F(30,500); x.fillText(`Statistiche 2015 · ${s.total} partite`,245,172);
      x.fillStyle=C.txt; x.font=F(34,700);
      x.fillText(`${s.v}V  ${s.n}N  ${s.s}P   ·   gol ${s.gf}:${s.gs}`,245,225);
      let y=310;
      x.strokeStyle=C.line; x.lineWidth=2; x.beginPath(); x.moveTo(70,y); x.lineTo(W-70,y); x.stroke();
      y+=50; x.fillStyle=C.dim; x.font=F(26,600);
      x.fillText("Giocatore",70,y); x.fillText("Part.",620,y); x.fillText("Tempi",760,y);
      x.fillText("Impiego",880,y); x.fillText("Gol",1010,y);
      y+=46;
      ord.forEach(p=>{
        x.fillStyle=C.tint; x.fillRect(70,y-26,(p.tempi/maxT)*520,36);
        x.fillStyle=C.txt; x.font=F(30,600); x.fillText(p.name,84,y);
        x.font=F(30,500); x.fillStyle=C.dim;
        x.fillText(String(p.presenze),628,y); x.fillText(String(p.tempi),772,y); x.fillText(p.impiego+"%",890,y);
        x.fillStyle=p.gol?C.gr:C.dim; x.font=F(30,700); x.fillText(String(p.gol),1016,y);
        y+=62;
      });
      try{ setImg(c.toDataURL("image/png")); }catch(e){}
    }
  },[roster,matches]);

  function esportaCSV(){
    const rows=[["Giocatore","Convocazioni","Presenze","Tempi giocati","Tempi disponibili","Impiego %","Gol","Media tempi a partita"]];
    for(const p of ord) rows.push([p.name,p.convocazioni,p.presenze,p.tempi,p.disponibili,p.impiego,p.gol,p.mediaTempi.toFixed(1)]);
    rows.push([]); rows.push(["Competizione","Vinte","Pari","Perse","Gol fatti","Gol subiti"]);
    for(const t of TYPES){ const b=s.byType[t.id]; if(b.v+b.n+b.p===0) continue;
      rows.push([t.label,b.v,b.n,b.p,b.gf,b.gs]); }
    rows.push(["Totale",s.v,s.n,s.s,s.gf,s.gs]);
    rows.push([]); rows.push(["Partita","Data","Tipo","Avversario","Casa/Trasferta","Tempi","Nostri gol","Gol subiti","Marcatori"]);
    matches.filter(m=>m.status==="done").sort((a,b)=>a.date<b.date?1:-1).forEach((m,i)=>{
      const [u,t]=scoreOf(m);
      const sc=m.goals.filter(g=>g.team==="us"&&g.playerId).map(g=>(roster.find(p=>p.id===g.playerId)||{}).name).filter(Boolean).join(", ");
      rows.push([i+1,fmtDate(m.date),typeLabel(m),m.opponent,m.home?"Casa":"Trasferta",m.periods,u,t,sc]);
    });
    const csv="\uFEFF"+rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
    download(csv,"statistiche-2015.csv","text/csv;charset=utf-8;");
  }

  return <><Header title="Statistiche" sub={`${CLUB} · ${s.total} partite`}/>
  <div className="px4 py5">
    <div className="printonly" style={{marginBottom:16}}>
      <div style={{fontSize:22,fontWeight:800,color:C.gr}}>{CLUB} — Statistiche 2015</div>
      <div style={{color:C.dim,fontSize:13}}>{s.total} partite · {s.v}V {s.n}N {s.s}P · gol {s.gf}:{s.gs}</div>
    </div>

    {s.total===0 && <div style={{color:C.dim,fontSize:15}}>Le statistiche compaiono quando chiudi la prima partita.</div>}

    {s.total>0 && <>
      <div className="grid g3 gap2 mb5">
        {[["Partite",s.total],["Gol fatti",s.gf],["Gol subiti",s.gs]].map(([l,v])=>
          <div key={l} style={{background:C.tint,borderRadius:12,padding:"14px 10px",textAlign:"center"}}>
            <div className="num" style={{fontSize:26,fontWeight:800,color:C.gr}}>{v}</div>
            <div style={{fontSize:12,color:C.dim}}>{l}</div></div>)}
      </div>

      <div style={{fontSize:16,fontWeight:800,marginBottom:8}}>Impiego dei ragazzi</div>
      <div className="flex ic py2" style={{color:C.dim,fontSize:12,borderBottom:"1px solid "+C.line}}>
        <span className="f1">Giocatore</span>
        <span style={{width:40,textAlign:"right"}}>Part.</span>
        <span style={{width:46,textAlign:"right"}}>Tempi</span>
        <span style={{width:54,textAlign:"right"}}>Impiego</span>
        <span style={{width:34,textAlign:"right"}}>Gol</span>
      </div>
      {ord.map(p=><div key={p.id} style={{borderBottom:"1px solid "+C.line,position:"relative"}}>
        <div style={{position:"absolute",left:0,top:0,bottom:0,width:(p.tempi/maxT*100)+"%",background:C.tint,borderRadius:4}}/>
        <div className="flex ic py3" style={{position:"relative",fontSize:15}}>
          <span className="f1" style={{fontWeight:600}}>{p.name}</span>
          <span className="num" style={{width:40,textAlign:"right",color:C.dim}}>{p.presenze}</span>
          <span className="num" style={{width:46,textAlign:"right"}}>{p.tempi}</span>
          <span className="num" style={{width:54,textAlign:"right",color:p.impiego<50?C.warn:C.dim}}>{p.impiego}%</span>
          <span className="num" style={{width:34,textAlign:"right",color:p.gol?C.gr:C.dim,fontWeight:700}}>{p.gol}</span>
        </div></div>)}
      <div style={{color:C.dim,fontSize:12,marginTop:8}}>
        Impiego = tempi giocati sul totale dei tempi delle partite in cui era convocato.</div>

      {marcatori.length>0 && <>
        <div style={{fontSize:16,fontWeight:800,margin:"24px 0 8px"}}>Marcatori</div>
        {marcatori.map((p,i)=><div key={p.id} className="flex ic jb py2" style={{borderBottom:"1px solid "+C.line,fontSize:15}}>
          <span><span style={{color:C.dim,marginRight:10}}>{i+1}</span>{p.name}</span>
          <span className="num" style={{color:C.gr,fontWeight:800}}>{p.gol}</span></div>)}
      </>}

      <div style={{fontSize:16,fontWeight:800,margin:"24px 0 8px"}}>Bilancio per competizione</div>
      {TYPES.map(t=>{ const b=s.byType[t.id]; if(b.v+b.n+b.p===0) return null;
        return <div key={t.id} className="flex ic jb py3" style={{borderBottom:"1px solid "+C.line}}>
          <span style={{fontSize:15,fontWeight:600}}>{t.label}</span>
          <span className="num" style={{fontSize:15,color:C.dim}}>{b.v}V {b.n}N {b.p}P · {b.gf}:{b.gs}</span></div>; })}

      <div className="noprint mt5">
        <div style={{fontSize:16,fontWeight:800,marginBottom:10}}>Esporta</div>
        <div className="grid g2 gap2">
          <Btn tone="solid" onClick={esportaCSV}>Excel (CSV)</Btn>
          <Btn onClick={()=>window.print()}>PDF / stampa</Btn>
        </div>
        {img && <a href={img} download="statistiche-2015.png" style={{display:"block",marginTop:8,background:"#fff",
          color:C.txt,border:"1px solid "+C.line,borderRadius:10,padding:"12px 14px",fontSize:15,fontWeight:600,
          textAlign:"center",textDecoration:"none"}}>Immagine per WhatsApp</a>}
        <div style={{color:C.dim,fontSize:12,marginTop:8}}>
          Per il PDF scegli "Salva come PDF" nella finestra di stampa. Da telefono puoi anche tenere premuta l'immagine qui sotto.</div>
        <canvas ref={cv} style={{width:"100%",marginTop:12,borderRadius:12,border:"1px solid "+C.line}}/>
      </div>
    </>}
  </div></>;
}

/* ---------------- squadra ---------------- */

function Team({roster,setRoster,db,setDb,admin,setAdmin,stato}) {
  const [name,setName]=useState("");
  const [imp,setImp]=useState(false);
  const [testo,setTesto]=useState("");
  const [chiave,setChiave]=useState(localStorage.getItem(KKEY)||"");
  const [msg,setMsg]=useState("");

  const add=()=>{ if(!name.trim()) return; setRoster([...roster,{id:uid(),name:name.trim()}]); setName(""); };

  function importa(){
    try{
      const d=JSON.parse(testo);
      if(!d.roster||!d.matches) throw new Error("formato non riconosciuto");
      setDb({...emptyDB,...d}); setImp(false); setTesto(""); setMsg("Backup importato.");
    }catch(e){ setMsg("Non riesco a leggere il backup: "+e.message); }
  }

  return <><Header title="Squadra" sub={`${CLUB} · 2015`}/>
  <div className="px4 py5">
    <div className="flex gap2 mb5">
      <input style={{...inp,flex:1}} value={name} onChange={e=>setName(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Nome del ragazzo"/>
      <Btn tone="solid" onClick={add}>Aggiungi</Btn>
    </div>
    {!roster.length && <div style={{color:C.dim,fontSize:15}}>La rosa è vuota. Aggiungi i ragazzi qui sopra.</div>}
    {roster.map(p=><div key={p.id} className="flex ic py3" style={{borderBottom:"1px solid "+C.line,fontSize:15}}>
      <span className="f1" style={{fontWeight:600}}>{p.name}</span>
      <button onClick={()=>setRoster(roster.filter(z=>z.id!==p.id))}
        style={{background:"none",border:"none",color:C.line,fontSize:20,cursor:"pointer"}}>×</button></div>)}

    <div style={{fontSize:16,fontWeight:800,margin:"28px 0 10px"}}>Backup e sincronizzazione</div>
    <div style={{background:C.sur,border:"1px solid "+C.line,borderRadius:12,padding:14,fontSize:14,marginBottom:12}}>
      {stato}
    </div>
    <div className="grid g2 gap2">
      <Btn onClick={()=>download(JSON.stringify(db,null,2),`backup-2015-${new Date().toISOString().slice(0,10)}.json`,"application/json")}>
        Scarica backup</Btn>
      <Btn onClick={()=>setImp(true)}>Importa backup</Btn>
    </div>

    {cloud && <div className="mt5">
      <Field label="Chiave di scrittura (solo sul tuo telefono)">
        <input style={inp} type="password" value={chiave} onChange={e=>setChiave(e.target.value)} placeholder="la chiave scelta nello snippet SQL"/>
      </Field>
      <Btn tone="solid" style={{width:"100%"}} onClick={()=>{ localStorage.setItem(KKEY,chiave); setAdmin(!!chiave);
        setMsg(chiave?"Modalità modifica attiva.":"Modalità sola lettura."); }}>
        {admin?"Aggiorna chiave":"Attiva la modifica"}</Btn>
    </div>}

    {msg && <div style={{color:C.gr,fontSize:14,marginTop:12}}>{msg}</div>}

    {imp && <Sheet onClose={()=>setImp(false)} title="Importa un backup">
      <div style={{color:C.dim,fontSize:13,marginBottom:10}}>Incolla qui il contenuto del file JSON, oppure scegli il file.</div>
      <input type="file" accept="application/json" style={{marginBottom:12,fontSize:14}} onChange={e=>{
        const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
        rd.onload=()=>setTesto(String(rd.result)); rd.readAsText(f); }}/>
      <textarea style={{...inp,minHeight:140,fontSize:13}} value={testo} onChange={e=>setTesto(e.target.value)} placeholder='{"version":4,"roster":[…],"matches":[…]}'/>
      <div className="mt4"><Btn tone="solid" onClick={importa} style={{width:"100%"}}>Importa e sostituisci</Btn></div>
    </Sheet>}
  </div></>;
}

/* ---------------- app ---------------- */

function App() {
  const [db,setDb]=useState(null);
  const [tab,setTab]=useState("gare");
  const [screen,setScreen]=useState(null);
  const [admin,setAdmin]=useState(!cloud || !!localStorage.getItem(KKEY));
  const [stato,setStato]=useState("");
  const [pending,setPending]=useState(false);
  const first=useRef(true);

  async function carica(silenzioso){
    try{
      if(cloud){
        const d=await cloudLoad();
        const locale=localLoad();
        const scelto = d || locale || emptyDB;
        setDb({...emptyDB,...scelto});
        setStato(cloud ? "Collegata al cloud: i dati sono online e visibili a chi ha il link." : "");
      } else {
        setDb({...emptyDB,...(localLoad()||emptyDB)});
        setStato("Salvataggio solo su questo dispositivo. Scarica un backup ogni tanto.");
      }
    }catch(e){
      if(!silenzioso){ setDb({...emptyDB,...(localLoad()||emptyDB)});
        setStato("Cloud non raggiungibile: sto usando la copia locale. Si sincronizza appena torna la rete."); }
    }
  }

  useEffect(()=>{ carica(false); },[]);

  useEffect(()=>{
    if(!db) return;
    if(first.current){ first.current=false;
      const live=db.matches.find(m=>m.status==="live");
      if(live) setScreen({name:"live",id:live.id});
      return; }
    localSave(db);
    if(cloud && admin){
      cloudSave(db, localStorage.getItem(KKEY)||"")
        .then(()=>setPending(false))
        .catch(e=>{ setPending(true); setStato("Non salvato online ("+e.message+"). La copia locale è al sicuro."); });
    }
  },[db]);

  // i genitori vedono la partita aggiornarsi da sola
  useEffect(()=>{
    if(!cloud || admin) return;
    const t=setInterval(()=>carica(true),10000);
    return ()=>clearInterval(t);
  },[admin]);

  if(!db) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"60vh",color:C.dim}}>Carico i dati…</div>;

  const find=id=>db.matches.find(m=>m.id===id);
  const upsert=m=>setDb({...db,matches: db.matches.some(x=>x.id===m.id)?db.matches.map(x=>x.id===m.id?m:x):[...db.matches,m]});
  const drop=id=>setDb({...db,matches:db.matches.filter(m=>m.id!==id)});
  const live=db.matches.find(m=>m.status==="live");
  const readOnly=!admin;

  const tabs=[{id:"gare",label:"Gare"},{id:"storico",label:"Storico"},{id:"stats",label:"Statistiche"}];
  if(admin) tabs.push({id:"squadra",label:"Squadra"});

  let body=null;
  if(screen&&screen.name==="form"&&admin)
    body=<ConvForm roster={db.roster} initial={screen.id?find(screen.id):null}
      onBack={()=>setScreen(screen.id?{name:"conv",id:screen.id}:null)}
      onSave={m=>{upsert(m); setScreen({name:"conv",id:m.id});}}/>;
  else if(screen&&screen.name==="conv"&&find(screen.id))
    body=<ConvDetail match={find(screen.id)} roster={db.roster} readOnly={readOnly}
      onBack={()=>setScreen(null)} onEdit={()=>setScreen({name:"form",id:screen.id})}
      onDelete={()=>{drop(screen.id); setScreen(null);}}
      onStart={p=>{upsert({...find(screen.id),periods:p,cur:1,status:"live"}); setScreen({name:"live",id:screen.id});}}/>;
  else if(screen&&screen.name==="live"&&find(screen.id))
    body=<LiveMatch match={find(screen.id)} roster={db.roster} update={upsert} readOnly={readOnly}
      onBack={()=>setScreen(null)}
      finish={()=>{upsert({...find(screen.id),status:"done"}); setScreen(null); setTab("storico");}}/>;
  else if(tab==="gare")
    body=<Gare matches={db.matches} readOnly={readOnly} live={!!live}
      create={()=>setScreen({name:"form",id:null})}
      open={id=>setScreen({name:find(id).status==="live"?"live":"conv",id})}/>;
  else if(tab==="storico")
    body=<History matches={db.matches} roster={db.roster} readOnly={readOnly}
      reopen={id=>{upsert({...find(id),status:"live"}); setScreen({name:"live",id});}} remove={drop}/>;
  else if(tab==="stats")
    body=<Stats roster={db.roster} matches={db.matches}/>;
  else
    body=<Team roster={db.roster} setRoster={r=>setDb({...db,roster:r})} db={db} setDb={setDb}
      admin={admin} setAdmin={setAdmin} stato={stato}/>;

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <div style={{flex:1}}>
      {pending && <div className="noprint" style={{background:C.tint,color:C.gr,fontSize:13,padding:"10px 16px"}}>
        Modifiche non ancora sincronizzate online.</div>}
      {body}
    </div>
    <div className="noprint" style={{position:"sticky",bottom:0,display:"flex",background:"#fff",
      borderTop:"1px solid "+C.line,paddingBottom:"env(safe-area-inset-bottom)"}}>
      {tabs.map(t=>{ const on=!screen&&tab===t.id;
        return <button key={t.id} onClick={()=>{setScreen(null); setTab(t.id);}}
          style={{flex:1,padding:"14px 0",background:"none",border:"none",
            borderTop:"3px solid "+(on?C.gr:"transparent"),color:on?C.gr:C.dim,
            fontSize:13,fontWeight:700,cursor:"pointer"}}>{t.label}</button>; })}
    </div>
  </div>;
}

/* manifest per "Aggiungi a schermata Home" */

  const mf = { name:"Torino Club MP · 2015", short_name:"Torino 2015", start_url:".",
    display:"standalone", background_color:"#ffffff", theme_color:"#922F29",
