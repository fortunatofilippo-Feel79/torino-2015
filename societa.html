<style>
 :root{--gr:#922F29;--tint:#F7EAE9;--line:#E3DBDA;--txt:#231715;--dim:#8A7A78;--sur:#FBFAFA;--warn:#A97612}
 *{box-sizing:border-box}
 body{margin:0;background:#fff;color:var(--txt);
   font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 header{background:var(--gr);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
 header img{width:34px;height:37px}
 h1{font-size:18px;font-weight:800;margin:0}
 .sub{font-size:12px;opacity:.85}
 main{padding:16px;max-width:900px;margin:0 auto}
 h2{font-size:16px;font-weight:800;margin:28px 0 10px}
 h2:first-of-type{margin-top:8px}
 .num{font-variant-numeric:tabular-nums}
 table{width:100%;border-collapse:collapse;font-size:14px}
 th{text-align:right;color:var(--dim);font-size:12px;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
 th:first-child,td:first-child{text-align:left}
 td{text-align:right;padding:10px 4px;border-bottom:1px solid var(--line)}
 .card{background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
 .riga{display:flex;justify-content:space-between;align-items:center;gap:12px}
 .tag{background:var(--tint);color:var(--gr);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
 .muto{color:var(--dim);font-size:13px}
 .vecchio{color:var(--warn);font-weight:700}
 details{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
 summary{cursor:pointer;font-weight:700;font-size:15px}
 .err{background:var(--tint);border:1px solid var(--gr);color:var(--gr);border-radius:12px;padding:14px;font-size:14px}
</style>
</head>

async function carica(){
  const r = await fetch(URL_BASE+"/rest/v1/stato?select=id,dati,aggiornato&order=id.desc",
    { headers:{ apikey:CHIAVE, Authorization:"Bearer "+CHIAVE } });
  if(!r.ok) throw new Error("il server ha risposto "+r.status);
  return r.json();
}

function analizza(riga){
  const d = riga.dati || {roster:[],matches:[]};
  const rosa = d.roster||[], gare = d.matches||[];
  const chiuse = gare.filter(m=>m.status==="done");
  let v=0,n=0,p=0,gf=0,gs=0;
  for(const m of chiuse){ const [u,t]=punteggio(m); gf+=u; gs+=t;
    const o=esito(m); if(o==="V")v++; else if(o==="P")p++; else n++; }
  const giocatori = rosa.map(g=>{
    let minuti=0, presenze=0, convocazioni=0, dispMin=0, gol=0;
    for(const m of chiuse){
      if(!(m.squad||[]).includes(g.id)) continue;
      convocazioni++; dispMin += (m.periods||3)*(m.durata||15);
      const t=((m.lineup||{})[g.id]||[]).length; if(t>0) presenze++;
      minuti += minutiDi(m,g.id);
      gol += (m.goals||[]).filter(x=>x.playerId===g.id).length;
    }
    return { nome:g.name, presenze, convocazioni, gol, minuti:Math.round(minuti),
      impiego: dispMin?Math.round(minuti/dispMin*100):0 };
  }).sort((a,b)=>b.minuti-a.minuti||a.nome.localeCompare(b.nome));
  const prossime = gare.filter(m=>m.status!=="done")
    .sort((a,b)=> a.date>b.date?1:-1);
  return { id:riga.id, aggiornato:riga.aggiornato, rosa:rosa.length, gare:chiuse.length,
    v,n,p,gf,gs, giocatori, prossime, inCorso: gare.some(m=>m.status==="live") };
}

function disegna(squadre){
  const attive = squadre.filter(s=>s.rosa>0 || s.gare>0 || s.prossime.length>0);
  document.getElementById("sottotitolo").textContent =
    squadre.length+" annate configurate · "+attive.length+" in uso";

  let h = "";

  h += "<h2>Bilanci per annata</h2><table><tr><th>Annata</th><th>Gare</th><th>V</th><th>N</th><th>P</th><th>Gol</th></tr>";
  for(const s of squadre) h += "<tr><td><b>"+esc(s.id)+"</b></td><td class=num>"+s.gare+"</td>"
    + "<td class=num>"+s.v+"</td><td class=num>"+s.n+"</td><td class=num>"+s.p+"</td>"
    + "<td class=num>"+s.gf+":"+s.gs+"</td></tr>";
  const tot = squadre.reduce((a,s)=>({g:a.g+s.gare,v:a.v+s.v,n:a.n+s.n,p:a.p+s.p,gf:a.gf+s.gf,gs:a.gs+s.gs}),
    {g:0,v:0,n:0,p:0,gf:0,gs:0});
  h += "<tr><td><b>Totale società</b></td><td class=num><b>"+tot.g+"</b></td><td class=num><b>"+tot.v+"</b></td>"
    + "<td class=num><b>"+tot.n+"</b></td><td class=num><b>"+tot.p+"</b></td>"
    + "<td class=num><b>"+tot.gf+":"+tot.gs+"</b></td></tr></table>";

  const prossime = [];
  for(const s of squadre) for(const m of s.prossime) prossime.push({...m, annata:s.id});
  prossime.sort((a,b)=> a.date>b.date?1:-1);
  h += "<h2>Prossimi impegni</h2>";
  if(!prossime.length) h += "<p class=muto>Nessuna convocazione in programma.</p>";
  for(const m of prossime.slice(0,25)){
    const tipo = m.type==="torneo" ? (m.tournament||"Torneo") : (TIPI[m.type]||m.type);
    h += "<div class=card><div class=riga><div><b>"+esc(m.opponent||"Avversario")+"</b> "
      + "<span class=tag>"+esc(m.annata)+"</span>"
      + (m.status==="live"?" <span class=tag>in corso</span>":"")
      + "<div class=muto>"+esc(fmtLungo(m.date))+" · "+esc(tipo)+" · "
      + (m.home?"in casa":"in trasferta") + (m.meetTime?" · ritrovo "+esc(m.meetTime):"") + "</div></div>"
      + "<div class='num muto'>"+(m.squad||[]).length+" conv.</div></div></div>";
  }

  h += "<h2>Impiego dei ragazzi</h2>";
  for(const s of squadre){
    if(!s.giocatori.length) continue;
    h += "<details><summary>"+esc(s.id)+" — "+s.giocatori.length+" giocatori, "+s.gare+" gare</summary>"
      + "<table><tr><th>Giocatore</th><th>Conv.</th><th>Pres.</th><th>Min</th><th>Impiego</th><th>Gol</th></tr>";
    for(const g of s.giocatori) h += "<tr><td>"+esc(g.nome)+"</td><td class=num>"+g.convocazioni+"</td>"
      + "<td class=num>"+g.presenze+"</td><td class=num>"+g.minuti+"′</td>"
      + "<td class=num"+(g.impiego<50?" style='color:var(--warn)'":"")+">"+g.impiego+"%</td>"
      + "<td class=num>"+g.gol+"</td></tr>";
    h += "</table></details>";
  }

  h += "<h2>Chi sta usando l'app</h2><table><tr><th>Annata</th><th>Rosa</th><th>Gare</th><th>Ultimo aggiornamento</th></tr>";
  const ora = Date.now();
  for(const s of squadre){
    const t = s.aggiornato ? new Date(s.aggiornato) : null;
    const giorni = t ? Math.floor((ora-t.getTime())/86400000) : null;
    const testo = !t ? "mai" : (giorni===0 ? "oggi" : giorni===1 ? "ieri" : giorni+" giorni fa");
    h += "<tr><td><b>"+esc(s.id)+"</b>"+(s.inCorso?" <span class=tag>gara in corso</span>":"")+"</td>"
      + "<td class=num>"+s.rosa+"</td><td class=num>"+s.gare+"</td>"
      + "<td class='num"+(giorni===null||giorni>21?" vecchio":"")+"'>"+testo+"</td></tr>";
  }
  h += "</table><p class=muto>Un'annata ferma da settimane di solito vuol dire che il dirigente ha smesso di usarla, oppure che non ha mai inserito la password di scrittura.</p>";

  document.getElementById("app").innerHTML = h;
}

carica()
  .then(righe => disegna(righe.map(analizza)))
  .catch(e => {
    document.getElementById("sottotitolo").textContent = "errore";
    document.getElementById("app").innerHTML =
      "<div class=err>Non riesco a leggere i dati: "+esc(e.message)
      + ".<br>Controlla che indirizzo e chiave in cima al file siano quelli giusti.</div>";
  });
</script>
</body>
</html>
